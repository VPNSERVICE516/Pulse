name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp pulse-icon.png assets/icon.png
      - name: Add Android
        run: npx cap add android
      - name: Firebase config
        run: cp google-services.json android/app/google-services.json
      - name: App icon
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2F63DC' --iconBackgroundColorDark '#2F63DC'
      - name: Sync
        run: npx cap sync android
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
