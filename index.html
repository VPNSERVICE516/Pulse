<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{--bg:#071229;--bg2:#0F2148;--t:#EAF0FF;--d:#8FA3CC;--g:rgba(24,40,84,.5);--gb:rgba(255,255,255,.14);--f:rgba(255,255,255,.07);--on:#071229;--a:#4F86EC;
 background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg));color:var(--t);font:600 16px/1.35 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
body.light{--bg:#DFE7FA;--bg2:#EEF3FF;--t:#12234D;--d:#4A5F8F;--g:rgba(255,255,255,.62);--gb:rgba(255,255,255,.85);--f:rgba(18,35,77,.07);--on:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scr{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.scr.on{display:flex}.tab{padding-bottom:130px}
h1{font-size:34px;font-weight:800;margin:56px 0 0;letter-spacing:-.5px}h2{font-size:24px;margin:0;font-weight:800}
.d{color:var(--d);font-size:15px;margin:0}.c{text-align:center}.sp{flex:1}
.glass{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.btn{height:56px;flex:0 0 auto;border-radius:999px;border:0;font:800 18px inherit;font-family:inherit;background:var(--f);color:var(--t);cursor:pointer}
.btn.p{background:var(--a);color:var(--on)}.btn.p:disabled{opacity:.45}
.in{height:56px;flex:0 0 auto;width:100%;border-radius:22px;border:1.5px solid var(--gb);background:var(--f);color:var(--t);padding:0 20px;font:inherit;outline:0}.in:focus{border-color:var(--a)}
.rb{width:52px;height:52px;border-radius:18px;border:0;background:var(--f);color:var(--t);display:grid;place-items:center;cursor:pointer}
.top{display:flex;gap:10px}#tb{position:fixed;right:20px;top:calc(20px + env(safe-area-inset-top));z-index:60;display:none}body.au #tb{display:grid}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{width:200px;height:200px;margin:auto auto 0;color:var(--a)}.brand{font-size:46px;font-weight:800;text-align:center;margin:18px 0 auto}
.cells{display:flex;gap:8px;justify-content:center;margin:8px 0}.cell{width:48px;height:62px;border-radius:16px;border:2px solid var(--gb);background:var(--f);display:grid;place-items:center;font-size:30px;font-weight:800}.cell.cur{border-color:var(--a)}.cells.err{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 24px;justify-content:center;margin-top:auto}.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--f);color:var(--t);font:800 28px inherit;font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bars{display:flex;gap:6px;justify-content:center}.bars i{width:28px;height:4px;border-radius:4px;background:var(--gb)}.bars i.on{background:var(--t)}
.av{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;background:var(--a);color:var(--on);font-weight:800;font-size:20px;overflow:hidden;background-size:cover;background-position:center;border-radius:50%}
body[data-av=blob] .av{border-radius:38% 62% 63% 37%/41% 44% 56% 59%}body[data-av=sq] .av{border-radius:30%}body[data-av=hex] .av{border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.av.big{width:120px;height:120px;font-size:44px;margin:8px auto}
.key{font:700 22px ui-monospace,Menlo,monospace;text-align:center;padding:20px 10px;border-radius:22px;letter-spacing:1px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:22px;cursor:pointer}.row:active{background:var(--f)}.row>div:nth-child(2){flex:1;min-width:0}
.row b{display:block}.row span{color:var(--d);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bd{background:var(--a);color:var(--on);border-radius:99px;padding:2px 8px;font-size:13px}
.hd{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:26px}.hd b{flex:1}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:6px 0}
.b{max-width:78%;padding:10px 14px;border-radius:20px;margin:3px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;word-break:break-word;touch-action:pan-y}
.b.me{align-self:flex-end;background:var(--a);color:var(--on);border-bottom-right-radius:6px}.b.th{align-self:flex-start;background:var(--g);border:1px solid var(--gb);border-bottom-left-radius:6px}
.b small{display:block;opacity:.6;font-size:11px;text-align:right}
.bar{display:flex;gap:8px;padding:8px;border-radius:30px;align-items:center}.bar .in{height:46px;border:0;background:transparent}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--t)}
details.glass{border-radius:24px;padding:4px 16px}summary{padding:14px 0;font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.opt button{padding:9px 14px;border-radius:99px;border:1px solid var(--gb);background:var(--f);color:var(--t);font:700 14px inherit;font-family:inherit}.opt button.on{background:var(--a);color:var(--on);border-color:var(--a)}
.line{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0 12px}.line p{margin:0}
.tg{width:52px;height:30px;border-radius:99px;background:var(--f);border:1px solid var(--gb);position:relative;flex:0 0 auto;cursor:pointer}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t);transition:.2s}.tg.on{background:var(--a)}.tg.on:after{left:25px;background:var(--on)}
.donut{width:120px;height:120px;border-radius:50%;margin:8px auto}input[type=range]{width:100%;accent-color:var(--a)}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);height:68px;padding:0 10px;display:flex;align-items:center;gap:6px;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none;z-index:50}
body.au #dock,body.inchat #dock{display:none}
.di{width:48px;height:48px;flex:0 0 auto;border:0;background:none;color:var(--d);display:grid;place-items:center;position:relative;padding:0;transition:width .38s cubic-bezier(.34,1.56,.64,1)}
.di .ico{display:grid;place-items:center;transform-origin:50% 100%;transition:transform .38s cubic-bezier(.34,1.56,.64,1)}
.di.active{color:var(--a)}.di.active:after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--a)}
.di .lbl{position:absolute;bottom:calc(100% + 26px);font-size:12px;font-weight:800;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none}.di.hot .lbl{opacity:1}.di.hot{color:var(--a)}
#dock.mag .di,#dock.mag .di .ico{transition:none}
#ov{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}#ov.show{display:flex}
#ov .b{animation:pop .25s cubic-bezier(.34,1.56,.64,1) forwards}@keyframes pop{to{transform:scale(1.07)}}
.menu{border-radius:22px;overflow:hidden;min-width:230px}.menu button{display:block;width:100%;padding:14px 18px;border:0;background:none;color:var(--t);font:700 16px inherit;font-family:inherit;text-align:left;border-bottom:1px solid var(--gb)}.menu button:last-child{border:0;color:#ff6b6b}.rx{display:flex;justify-content:space-around;padding:10px;font-size:24px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-90px);padding:12px 18px;border-radius:99px;z-index:99;transition:transform .35s;max-width:90%;text-align:center;font-size:14px}#toast.show{transform:translate(-50%,0)}
.btn,.rb,.opt button,.menu button,.pad button{position:relative;overflow:hidden;transition:border-radius .24s cubic-bezier(.2,0,0,1),background-color .2s,color .2s}
.btn::after,.rb::after,.opt button::after,.menu button::after,.pad button::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none;border-radius:inherit}
@media (hover:hover){.btn:hover::after,.rb:hover::after,.opt button:hover::after,.menu button:hover::after,.pad button:hover::after{opacity:.08}}
.btn:active::after,.rb:active::after,.opt button:active::after,.menu button:active::after,.pad button:active::after,.btn:focus-visible::after{opacity:.12}
.btn:active{border-radius:20px}.rb:active{border-radius:50%}.pad button:active{border-radius:26px;color:var(--a)}.opt button:active{border-radius:12px}
.btn:focus-visible,.rb:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.26;transform:scale(0);pointer-events:none;transition:transform .5s cubic-bezier(.2,0,0,1),opacity .35s}
.pk{position:relative;overflow:visible;cursor:pointer}.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;border-radius:inherit}
.plus{position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;background:var(--a);color:var(--on);display:grid;place-items:center;font-size:26px;border:3px solid var(--bg);pointer-events:none}
.lnk{background:none;border:0;color:var(--d);font:700 14px inherit;font-family:inherit;padding:8px;align-self:center}.key{user-select:text;-webkit-user-select:text}
.di{z-index:1}.di.active:after{display:none}
#bub{position:absolute;left:0;top:50%;width:62px;height:56px;margin-top:-28px;border-radius:999px;pointer-events:none;z-index:0;transform:translateX(0);
 background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03));backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -6px 12px rgba(255,255,255,.04),0 4px 12px rgba(0,0,0,.18);
 transition:transform .5s cubic-bezier(.34,1.35,.5,1),width .5s cubic-bezier(.34,1.35,.5,1)}
#bub.hold{transition:none}
#dock.glass{background:none;border-color:rgba(255,255,255,.1);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
#dock::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.03);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.bar .in{flex:1;min-width:0;width:auto}.bar .rb{flex:0 0 auto}#msgs{min-height:0}#s-chat{overflow:hidden}
.mw{display:flex;flex-direction:column;max-width:78%;margin:3px 0}.mw.me{align-self:flex-end;align-items:flex-end}.mw.th{align-self:flex-start;align-items:flex-start}.mw .b{max-width:100%;margin:0;align-self:auto}
.rxs{display:flex;gap:4px;margin:-7px 10px 2px;position:relative;z-index:1}.rxs span{background:var(--g);border:1px solid var(--gb);border-radius:99px;padding:1px 7px;font-size:15px}.rx span{padding:4px 6px;cursor:pointer}
.ban{position:relative;height:210px;flex:0 0 auto;border-radius:32px;background:linear-gradient(135deg,var(--a),#8B6CF0) center/cover;display:grid;place-items:center;overflow:hidden;border:1px solid var(--gb)}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.3));pointer-events:none}
.ban .av{position:relative;z-index:1;margin:0;border:4px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(0,0,0,.35)}.ban.pk{overflow:hidden}
.bt{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#fff;z-index:2;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
textarea.in{height:96px;padding:14px 20px;resize:none}
.ptop{display:flex}.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:4px}.pl{flex:1;min-width:0;padding-bottom:8px}.pr{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.pname{background:none;border:0;color:var(--t);font-weight:800;font-size:28px;font-family:inherit;padding:0;display:flex;align-items:center;gap:8px;max-width:100%;text-align:left;cursor:pointer}.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pname svg{width:20px;height:20px;flex:0 0 auto;stroke-width:3}
.av.pav{width:136px;height:136px;font-size:52px;border:2px solid var(--gb)}
.note{position:relative;max-width:170px;margin:0 6px 14px 0;padding:10px 14px;border-radius:20px;background:var(--g);border:1px solid var(--gb);color:var(--t);font-weight:700;font-size:15px;font-family:inherit;text-align:center;cursor:pointer;word-break:break-word}
.note.ph{color:var(--d)}.note::after{content:"";position:absolute;bottom:-7px;right:38px;width:10px;height:10px;border-radius:50%;background:var(--g);border:1px solid var(--gb)}
#pb{margin:16px 0 0;white-space:pre-wrap;font-size:17px;line-height:1.4;word-break:break-word}

.hero{position:relative;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;color:var(--t)}
.hero.has-bn{justify-content:space-between;height:58vh;min-height:380px;margin:calc(-20px - env(safe-area-inset-top)) -20px 0;padding:calc(16px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 36px 36px;background:linear-gradient(135deg,var(--a),#8B6CF0) center/cover;overflow:hidden;color:#fff}
.hero.has-bn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 45%,rgba(0,0,0,.62));pointer-events:none}
.pen{position:relative;z-index:3;align-self:flex-start;width:46px;height:46px;margin-left:-8px;background:none;color:inherit}
.hero.has-bn .pen{margin-left:0;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hbot{position:relative;z-index:3}.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.pl{flex:1;min-width:0;padding-top:44px}
.pname{color:inherit;font-size:30px}.pname svg{width:17px;height:17px;fill:currentColor;stroke:none}
.hero #pu{margin:14px 0 0;color:var(--d)}.hero.has-bn #pu{color:rgba(255,255,255,.8)}
.av.pav{width:104px;height:104px;font-size:42px;border:2px solid var(--gb)}.hero.has-bn .av.pav{border:3px solid rgba(255,255,255,.9)}
.note{font-size:13.5px;padding:8px 12px;margin:0 2px 12px 0;max-width:180px}
.hero.has-bn .note{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.hero.has-bn .note.ph{color:rgba(255,255,255,.78)}.hero.has-bn .note::after{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.25)}
#pb{margin:22px 0 0}#pb .dim{color:var(--d)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

 if(/спасибо|thanks|thank/.test(q))return ru?'Пожалуйста!':'You are welcome!';
 return ru?'Пока я понимаю простое: счёт, время, дату, шутки и подсказки по Pulse. Для умных ответов подключите сервер ИИ в Настройках → Ассистент.':'I only handle simple things: math, time, date, jokes and Pulse tips. Connect an AI server in Settings → Assistant.'}
async function aiReply(c,v){if(S.aiUrl){try{const h=c.m.filter(m=>!m.hid&&!m.typing).slice(-12).map(m=>({role:m.f?'user':'assistant',content:m.x}));const r=await fetch(S.aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h})});if(r.ok){const j=await r.json();if(j&&j.reply)return String(j.reply)}}catch(e){}}return local(v)}
async function aiAnswer(c,v){if(cur===c)$('#hst').textContent=t('typing');const a=await aiReply(c,v);await new Promise(r=>setTimeout(r,500+Math.random()*500));c.m.push({f:0,x:a,ts:Date.now()});save();if(cur===c){$('#hst').textContent='';if($('#s-chat').classList.contains('on'))drawMsgs()}}
function delDlg(m){const ov=$('#ov');ov.innerHTML='';const w=document.createElement('div');w.className='glass';w.style.cssText='padding:20px;border-radius:28px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center';const p=document.createElement('p');p.style.margin='0 0 6px';p.textContent=t(m.f?'delq':'delqo');
 const mk=(tx,c,fn)=>{const b=document.createElement('button');b.className=c;b.textContent=tx;b.onclick=fn;return b};const fin=()=>{save();drawMsgs();ov.classList.remove('show')};
 w.append(p,mk(t('delme'),'btn',()=>{m.hid=1;fin()}),mk(t('delall'),'btn p',()=>{const k=cur.m.indexOf(m);if(k>=0)cur.m.splice(k,1);fin()}),mk(t('no'),'btn',()=>ov.classList.remove('show')));ov.append(w)}
function fit(f,w,h,cb){const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);cb(c.toDataURL('image/jpeg',.82));URL.revokeObjectURL(u)};im.onerror=()=>toast(t('imgbad'));im.src=u}
let eAv='',eBn='';
function prevE(){const a=$('#eav');a.style.backgroundImage=eAv?`url(${eAv})`:'';a.querySelector('svg').style.display=eAv?'none':''}
$('#pedit').onclick=()=>{const u=S.user||{};eAv=u.avatar||'';$('#enm').value=u.name||'';$('#eun').value=u.uname||'';$('#ebio').value=u.bio||'';prevE();go('s-pedit')};
$('#afile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)fit(f,160,160,d=>{eAv=d;prevE()});e.target.value=''};
$('#psave').onclick=()=>{const n=$('#enm').value.trim(),u=$('#eun').value.trim().replace(/^@/,'');if(!n){$('#enm').focus();return}if(!/^[a-z0-9_]{3,24}$/i.test(u)){toast(t('badu'));return}
 Object.assign(S.user,{name:n,uname:u,bio:$('#ebio').value.trim().slice(0,140),avatar:eAv});save();regUser();toast(t('psaved'));go('s-profile')};

function askText(ttl,val,max){return new Promise(r=>{const ov=$('#ov');ov.innerHTML='';const w=document.createElement('div');w.className='glass';w.style.cssText='padding:20px;border-radius:28px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px';const p=document.createElement('p');p.style.cssText='margin:0;font-weight:800;text-align:center';p.textContent=ttl;const i=document.createElement('input');i.className='in';i.value=val||'';i.maxLength=max;const row=document.createElement('div');row.style.cssText='display:flex;gap:10px';
 const done=v=>{ov.classList.remove('show');ov._cb=null;r(v)};const mk=(tx,c,ok)=>{const b=document.createElement('button');b.className=c;b.textContent=tx;b.style.flex=1;b.onclick=()=>done(ok?i.value.trim():null);return b};
 i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())};row.append(mk(t('no'),'btn',false),mk(t('savep'),'btn p',true));w.append(p,i,row);ov.append(w);ov._cb=()=>r(null);ov.classList.add('show');setTimeout(()=>i.focus(),60)})}
$('#pnote').onclick=async()=>{const v=await askText(t('noteT'),S.user.note||'',60);if(v!==null){S.user.note=v;save();render('s-profile')}};
$('#pfile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)fit(f,240,240,d=>{S.user.avatar=d;save();render('s-profile')});e.target.value=''};
$('#pnb').onclick=()=>{const ov=$('#ov');ov.innerHTML='';const mn=document.createElement('div');mn.className='menu glass';mn.innerHTML=`<button data-a="e">${t('editp')}</button><button data-a="c">${t('cpu')}</button><button data-a="b">${t('chb')}</button>${S.user.banner?`<button data-a="x">${t('rmb')}</button>`:''}<button data-a="o">${t('logout')}</button>`;
 [...mn.children].slice(0,-1).forEach(b=>b.style.color='var(--t)');
 mn.onclick=e=>{const a=e.target.dataset.a;if(!a)return;ov.classList.remove('show');if(a==='e')$('#pedit').click();else if(a==='c')copyText('@'+S.user.uname).then(()=>toast(t('copied')));else if(a==='b')$('#pbfile').click();else if(a==='x'){S.user.banner='';save();render('s-profile')}else if(a==='o')logout()};ov.append(mn);ov.classList.add('show')};
$('#pbfile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)fit(f,800,1000,d=>{S.user.banner=d;save();render('s-profile')});e.target.value=''};

/* ---------- server: users, inbox, push ---------- */
const FB=()=>(S.dbUrl||'').trim().replace(/\/$/,''),me=()=>S.user.uname.toLowerCase();
const fb=(m,p,b)=>FB()?fetch(FB()+'/'+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(r=>r.ok?r.json():Promise.reject(r.status)):Promise.reject('nodb');
function regUser(){if(S.user&&FB())fb('PUT','users/'+me(),{name:S.user.name,uname:S.user.uname,ts:Date.now()}).catch(()=>{})}
async function deliver(c,v){if(!FB())return toast(t('nosrv'));try{await fb('POST','inbox/'+c.peer,{from:me(),name:S.user.name,x:v,ts:Date.now()})}catch(e){return toast(t('sendfail'))}
 if(S.pushUrl)fetch(S.pushUrl,{method:'POST',headers:{'Content-Type':'application/json','X-Pulse-Key':S.pushKey||''},body:JSON.stringify({to:c.peer,title:S.user.name,body:v})}).catch(()=>{})}
function take(k,v){if(!v||!v.from||S.chats.some(c=>c.m.some(m=>m.k===k)))return;let c=S.chats.find(x=>x.peer===v.from);if(!c){c={id:'u_'+v.from,name:v.name||v.from,peer:v.from,m:[]};S.chats.push(c)}
 c.m.push({f:0,x:String(v.x||'').slice(0,2000),ts:v.ts||Date.now(),k});save();fb('DELETE','inbox/'+me()+'/'+k).catch(()=>{});haptic('light');
 if($('#s-chat').classList.contains('on')&&cur===c)drawMsgs();else if($('#s-chats').classList.contains('on'))render('s-chats')}
let es=null;function listen(){if(es){es.close();es=null}if(!FB()||!S.user||!window.EventSource)return;es=new EventSource(FB()+'/inbox/'+me()+'.json');
 const h=e=>{try{const d=JSON.parse(e.data);if(!d)return;if(d.path==='/'){Object.entries(d.data||{}).forEach(([k,v])=>take(k,v))}else if(d.data)take(d.path.slice(1),d.data)}catch(x){}};es.addEventListener('put',h);es.addEventListener('patch',h)}
$('#st').addEventListener('change',e=>{if(e.target.id==='sdb'){regUser();listen();initPush()}});
async function initPush(){const PN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.PushNotifications;if(!PN||!S.user||!FB())return;
 try{let p=await PN.checkPermissions();if(p.receive!=='granted')p=await PN.requestPermissions();if(p.receive!=='granted')return;try{await PN.createChannel({id:'messages',name:'Сообщения',importance:4})}catch(e){}
  PN.addListener('registration',tk=>{fb('PUT','tokens/'+me(),tk.value).catch(()=>{})});await PN.register()}catch(e){}}

/* ---------- boot ---------- */
theme();i18n();drawCode();
if(S.user){stack=['s-welcome'];ensureChats();go('s-chats');regUser();listen();initPush()}
</script>
